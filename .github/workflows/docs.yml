# Builds the docs in strict mode on every pull request and push to main, and
# deploys them to GitHub Pages from main. The reference is read from the
# installed package at runtime, and the example plots are rendered by it, so the
# extension is built first (`uv run`).
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Check the API reference pages are up to date
        run: |
          uv run --group docs python docs/build_reference.py
          git status --porcelain docs/reference zensical.toml
          test -z "$(git status --porcelain docs/reference zensical.toml)"
      - name: Render the example plots
        run: uv run --group docs python docs/build_examples.py
      - name: Build the docs
        run: uv run --group docs zensical build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
