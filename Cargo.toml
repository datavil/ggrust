[workspace]
resolver = "3"
members = ["crates/ggrust-core", "crates/ggrust-python"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/datavil/ggrust"
rust-version = "1.85"

[workspace.dependencies]
arrow-array = "59.3"
arrow-cast = "59.3"
arrow-schema = "59.3"
arrow-select = "59.3"
ggrust-core = { path = "crates/ggrust-core" }
harfrust = "0.12"
pyo3 = { version = "0.30", features = ["abi3-py311"] }
pyo3-arrow = "0.20"
read-fonts = { version = "0.41", default-features = false, features = ["std"] }
resvg = { version = "0.48.1", default-features = false, features = ["text"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
