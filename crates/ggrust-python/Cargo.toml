[package]
name = "ggrust-python"
description = "PyO3 bindings for ggrust-core. Thin: convert, call core, return."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_ggrust"
crate-type = ["cdylib"]
# No Rust tests live here (they are in ggrust-core; the bindings are tested by
# pytest). A test binary would need to link libpython, which fails on CI.
test = false
doctest = false

[dependencies]
ggrust-core.workspace = true
pyo3.workspace = true
pyo3-arrow.workspace = true

[lints]
workspace = true
