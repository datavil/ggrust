site_name: ggrust
site_description: Grammar-of-graphics plotting in Rust with a lets_plot-compatible Python API
site_url: https://datavil.github.io/ggrust/
repo_url: https://github.com/datavil/ggrust
repo_name: datavil/ggrust
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

nav:
  - Home: index.md
  - Migrating from lets-plot: migration.md
  - API reference:
      - Plot and output: reference/plot.md
      - Geoms: reference/geoms.md
      - Positions: reference/positions.md
      - Scales: reference/scales.md
      - Coordinates and facets: reference/coords.md
      - Labels and guides: reference/labels.md
      - Themes: reference/themes.md
      - Grids and interactivity: reference/grids.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: numpy
            force_inspection: true  # signatures of functions built by assignment
            filters: ["!^_"]
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            heading_level: 2

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences

strict: true
