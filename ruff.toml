line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "D", "RUF"]
ignore = ["D105", "D107"]

[lint.pydocstyle]
convention = "numpy"

[lint.per-file-ignores]
"tests/**" = ["D"]
# Manual notebooks use the lets-plot idiom `from ggrust import *`.
"notebooks/**" = ["F403", "F405"]
