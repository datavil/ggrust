line-length = 100
target-version = "py311"
# Docs pages include example code with `--8<--` snippet lines, which are not Python.
extend-exclude = ["docs/**/*.md"]

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "D", "RUF", "ANN"]
ignore = ["D105", "D107"]

[lint.pydocstyle]
convention = "numpy"

[lint.flake8-annotations]
# `**other_args: Any` forwards lets_plot constants and options of any kind.
allow-star-arg-any = true

[lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
# Benchmarks duck-type plots of either library (ggrust or lets_plot).
"benchmarks/**" = ["ANN401"]
# Manual notebooks use the lets-plot idiom `from ggrust import *`.
"notebooks/**" = ["F403", "F405"]
# Docs examples: the title line is the docstring, and `plot` ends the cell as in a notebook.
"docs/examples/**" = ["B018", "D400"]
