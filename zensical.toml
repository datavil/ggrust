# Docs site, built with Zensical: `make docs` (or `make docs-serve`).
# Plots and gallery pages are generated first by `docs/build_examples.py`;
# they are not committed.

[project]
site_name = "ggrust"
site_description = "Grammar-of-graphics plotting in Rust with a lets_plot-compatible Python API"
site_url = "https://datavil.github.io/ggrust/"
repo_url = "https://github.com/datavil/ggrust"
repo_name = "datavil/ggrust"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; datavil. MIT license."
extra_css = ["stylesheets/ggrust.css"]
extra_javascript = ["javascripts/ggrust.js"]

nav = [
  { "Home" = "index.md" },
  { "Learn" = [
    "guide/index.md",
    { "Getting started" = "guide/getting-started.md" },
    { "Layers" = "guide/layers.md" },
    { "Scales and legends" = "guide/scales.md" },
    { "Facets and grids" = "guide/facets.md" },
    { "Themes" = "guide/themes.md" },
    { "Interactivity" = "guide/interactivity.md" },
    { "Export" = "guide/export.md" },
    { "Migrating from lets-plot" = "migration.md" },
  ] },
  { "Gallery" = [
    "gallery/index.md",
    { "Points and lines" = [
      "gallery/scatter.md",
      "gallery/line.md",
      "gallery/ribbon.md",
      "gallery/function.md",
    ] },
    { "Bars and tiles" = [
      "gallery/stacked_bars.md",
      "gallery/dodged_bars.md",
      "gallery/heatmap.md",
    ] },
    { "Distributions" = [
      "gallery/histogram.md",
      "gallery/boxplot.md",
      "gallery/violin.md",
      "gallery/ridges.md",
    ] },
    { "Labels, facets and grids" = [
      "gallery/text_repel.md",
      "gallery/facets.md",
      "gallery/grid.md",
    ] },
    { "Interactivity" = [
      "gallery/tooltips.md",
      "gallery/many_points.md",
    ] },
  ] },
  { "API reference" = [
    { "Plot and output" = "reference/plot.md" },
    { "Geoms" = "reference/geoms.md" },
    { "Positions" = "reference/positions.md" },
    { "Scales" = "reference/scales.md" },
    { "Coordinates and facets" = "reference/coords.md" },
    { "Labels and guides" = "reference/labels.md" },
    { "Themes" = "reference/themes.md" },
    { "Grids and interactivity" = "reference/grids.md" },
    { "Errors" = "reference/errors.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/chart-scatter"
repo = "fontawesome/brands/github"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/datavil/ggrust"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/ggrust/"

[project.plugins.mkdocstrings.handlers.python]
paths = ["python"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
force_inspection = true  # signatures of functions built by assignment
filters = ["!^_"]
show_root_heading = true
show_root_full_path = false
show_source = false
show_signature_annotations = true
separate_signature = true
heading_level = 2

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["docs/examples"]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
